name: Build PenKit

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install pyinstaller rich psutil
      - name: Compilar EXE
        run: pyinstaller --onefile --console --name PenKit penkit.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PenKit-Windows
          path: dist/PenKit.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install pyinstaller rich psutil
      - name: Compilar Linux
        run: pyinstaller --onefile --console --name penkit_linux penkit.py
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: PenKit-Linux
          path: dist/penkit_linux
